<body>
  <iframe id="iframe" src="https://site-183152c810994b758820268311a5b359.freebuff.page/" 
          allow="clipboard-read; clipboard-write; fullscreen; camera; microphone; payment"
          referrerpolicy="no-referrer-when-downgrade"
          style="width: 100%; height: 100%; border: none;">
  </iframe>
  
  <script>
    // Adjust iframe height for mobile address bar
    function adjustIframe() {
      const iframe = document.getElementById('iframe');
      const updateHeight = () => {
        iframe.style.height = Math.max(document.documentElement.clientHeight, 100) + 'px';
      };
      updateHeight();
      window.addEventListener('resize', updateHeight);
      // Handle mobile address bar show/hide
      if ('addEventListener' in window) {
        window.addEventListener('orientationchange', updateHeight);
      }
    }
    if (/iPhone|iPad|iPod/.test(navigator.userAgent) || (navigator.userAgent && navigator.userAgent.indexOf('Mac') > 0 && window.innerWidth > 0)) {
      // iOS specific handling
    }
    adjustIframe();
  </script>
